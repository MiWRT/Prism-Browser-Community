# 为 Intel 芯片的 Mac 构建 Prism Browser（macOS x64，适配 macOS 13.7.8 Ventura）
#
# 目标机：Intel x86_64 Mac，macOS 13.7.8（Ventura）
# 覆盖路径：直接覆盖仓库里旧的 .github/workflows/build-macos-x64.yml，
#           旧的 12.7.6 版本就此作废，不要两个 workflow 并存。
#
# 与 12.7.6 版相比，改动只有内核版本上限这一处，别的都不用动：
# - 官方发布包仍然只有 macOS arm64，没有 Intel（x64）版本，所以仍要自己打 x64 包
# - GitHub 的 Intel runner（macos-13）已于 2025-12 下线，仍在免费的
#   arm64 runner（macos-15）上用 electron-builder --x64 交叉编译 x64 安装包
# - Electron 43（Chromium 150）要求 macOS 12+，在 Ventura 13.7.8 上照常运行，
#   外壳不需要升级 Electron，升级只会多出回归风险
# - 关键变化：Chrome 150 是最后一个支持 macOS 12 的大版本，Chrome 151 起
#   要求 macOS 13 Ventura 或更高。升到 13.7.8 之后，150 这个上限就解除了，
#   内核可以直接用最新版，不用再被 150 卡住
# - 默认内核改为 ungoogled-chromium 156.0.8078.47-1.1（2026-10-28 发布，
#   已核实该 release 里有 ungoogled-chromium_156.0.8078.47-1.1_x86_64-macos.dmg，
#   且 Chrome 156 要求 macOS 13 或更高，正好落在 13.7.8 上）
# - 内核 tag 仍可手动改：主版本建议 >= 151；如果填了 <= 150，构建不会失败，
#   但会打印警告，因为那是 Monterey 时代的旧内核，在 Ventura 上没必要用
#
# 使用：仓库 Actions 页 -> "Build macOS Intel (x64) for Ventura 13" -> Run workflow ->
#       构建完成后在 Artifacts 里下载 dmg/zip
#
# 本地在 Intel Mac 13.7.8 上直接编（不用走 Actions）：
#   npm ci && npm run build
#   然后按下面“Download x64 kernel”一步把内核解到 kernel-staging/kernels/current，
#   再跑 npx electron-builder --mac dmg zip --x64 --publish never
#   （本机就是 x64，不用交叉编译；hdiutil、ditto 都是系统自带的）

name: Build macOS Intel (x64) for Ventura 13

on:
  workflow_dispatch:
    inputs:
      bundle_kernel:
        description: '是否把 x64 内核打包进应用（推荐开启，macOS 13 开箱即用）'
        required: false
        default: true
        type: boolean
      kernel_tag:
        description: '内核版本 tag（macOS 13.7.8 上主版本建议 >= 151，不再受 150 上限约束）'
        required: false
        default: '156.0.8078.47-1.1'

jobs:
  build:
    name: Build Prism Browser for macOS x64 (Ventura 13.7.8)
    runs-on: macos-15
    timeout-minutes: 120
    env:
      # 没有 Apple 开发者证书时跳过代码签名。
      # 未签名的应用首次打开会被 GateKeeper 拦截：右键 -> 打开即可，
      # 或执行 xattr -cr "/Applications/Prism Browser.app" 后再打开。
      # Ventura 13.7.8 上这一条和 12.7.6 时一样，不用改。
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck + build renderer/main
        run: npm run build

      - name: Download x64 kernel (ungoogled-chromium)
        if: ${{ inputs.bundle_kernel }}
        run: |
          set -euo pipefail
          TAG='${{ inputs.kernel_tag }}'
          MAJOR="${TAG%%.*}"
          if [ "${MAJOR}" -lt 151 ]; then
            echo "::warning::内核主版本 ${MAJOR} 是 Monterey（macOS 12）时代的版本，在 Ventura 13.7.8 上建议用 151 或更高（默认 156.0.8078.47-1.1），构建继续，不强制失败"
          fi
          API="https://api.github.com/repos/ungoogled-software/ungoogled-chromium-macos/releases/tags/${TAG}"
          echo "查询内核 release: ${API}"
          URL="$(curl -fsSL "${API}" | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          matches = [a['browser_download_url'] for a in data.get('assets', []) if a['name'].endswith('_x86_64-macos.dmg')]
          if not matches:
              raise SystemExit('release 里没有找到 x86_64-macos.dmg')
          print(matches[0])
          ")"
          echo "下载: ${URL}"
          curl -fSL --retry 3 -o /tmp/prism-kernel.dmg "${URL}"
          hdiutil attach -nobrowse -mountpoint /Volumes/prism-kernel /tmp/prism-kernel.dmg
          ls /Volumes/prism-kernel
          test -d '/Volumes/prism-kernel/Chromium.app' || { echo 'DMG 中没有找到 Chromium.app'; exit 1; }
          mkdir -p kernel-staging/kernels/current
          ditto '/Volumes/prism-kernel/Chromium.app' kernel-staging/kernels/current/Chromium.app
          hdiutil detach /Volumes/prism-kernel
          rm -f /tmp/prism-kernel.dmg
          KERNEL_VERSION="${TAG%%-*}"
          echo "内核版本: ${KERNEL_VERSION}"
          python3 - "${KERNEL_VERSION}" <<'PYEOF'
          import json, sys
          manifest = {
              "schemaVersion": 1,
              "version": sys.argv[1],
              "executableRelative": "Chromium.app/Contents/MacOS/Chromium",
              "target": "darwin-x64",
          }
          with open("kernel-staging/kernels/current/manifest.json", "w") as f:
              json.dump(manifest, f, indent=2)
          print(json.dumps(manifest, indent=2))
          PYEOF
          test -x kernel-staging/kernels/current/Chromium.app/Contents/MacOS/Chromium
          echo "内核已就绪"

      - name: Package macOS x64 (dmg + zip)
        run: |
          set -euo pipefail
          node -e "
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const config = { ...pkg.build };
          if ('${{ inputs.bundle_kernel }}' === 'true') {
            config.extraResources = [{ from: 'kernel-staging/kernels', to: 'kernels' }];
          }
          fs.writeFileSync('electron-builder.mac-x64.json', JSON.stringify(config, null, 2));
          console.log('electron-builder config written');
          "
          npx electron-builder --config electron-builder.mac-x64.json --mac dmg zip --x64 --publish never

      - name: Show artifacts
        run: ls -lh release/

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: prism-browser-mac-x64-ventura
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error
          retention-days: 30
